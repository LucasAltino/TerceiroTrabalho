services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devolucoes
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devolucoes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d devolucoes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devolucoes_postgres_data:
